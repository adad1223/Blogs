apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: anish1279/api-gateway:v2
          ports:
            - containerPort: 9000

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 9000       # The port on the service
      targetPort: 9000  # The container's port
      nodePort: 31000   # Exposed port on the node (must be in 30000-32767)
  type: NodePort